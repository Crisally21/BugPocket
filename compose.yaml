name: bugpocket

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bugpocket
      POSTGRES_USER: ${DB_USERNAME:-bugpocket}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before starting PostgreSQL}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/bugpocket
      DB_USERNAME: ${DB_USERNAME:-bugpocket}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before starting application}
      ATTACHMENT_STORAGE_ROOT: /app/data/attachments
    ports:
      - "8080:8080"
    volumes:
      - attachments_data:/app/data/attachments

volumes:
  postgres_data:
  attachments_data:
